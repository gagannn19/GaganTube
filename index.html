<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GAGANTUBE</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 30px;
    }
    header {
      background-color: #202020;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    header h1 {
      font-size: 2.5em;
      color: #ff0000;
      letter-spacing: 2px;
      font-weight: 700;
      text-shadow: 2px 2px 8px rgba(255,0,0,0.3);
    }
    input[type="text"], textarea {
      width: 70%;
      max-width: 500px;
      padding: 12px;
      font-size: 16px;
      margin: 10px auto;
      border: 1px solid #333;
      border-radius: 8px;
      background-color: #1c1c1c;
      color: #fff;
      display: block;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    #wordCount {
      font-size: 14px;
      margin-top: -5px;
      margin-bottom: 10px;
      color: #aaa;
    }
    button {
      padding: 10px 15px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      background-color: #ff0000;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background-color: #cc0000; }
    iframe {
      width: 90%;
      max-width: 800px;
      height: 450px;
      border: none;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: 0 0 20px rgba(255,0,0,0.2);
    }
    #error { color: #ff4d4d; margin-top: 10px; }
    #savedVideos {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }
    .videoCard {
      background: #1c1c1c;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s;
      position: relative;
      text-align: left;
    }
    .videoCard:hover { transform: scale(1.05); }
    .videoCard img {
      width: 100%;
      display: block;
    }
    .videoCard p {
      padding: 8px;
      font-size: 13px;
      color: #ccc;
      word-break: break-word;
    }
    .removeBtn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,0,0,0.8);
      border: none;
      color: white;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }
    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>GAGANTUBE</h1>
  </header>

  <p>Paste a YouTube video link below, write 50+ words about that video, and save it to your playlist!</p>
  <input type="text" id="youtubeLink" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
  
  <textarea id="accountabilityNote" placeholder="Write 50 words about that video"></textarea>
  <div id="wordCount">0 / 50 words</div>

  <button onclick="saveVideo()">Save</button>
  <button onclick="clearAllVideos()">Clear All Videos</button>
  
  <div id="videoContainer"></div>
  <div id="error"></div>

  <h2 style="margin-top:40px;">Saved Videos</h2>
  <div id="savedVideos"></div>

  <footer>
    © 2025 Gagan | GAGANTUBE – Watch Through Link
  </footer>

  <script>
    function extractVideoID(url) {
      try {
        let u = new URL(url);
        if (u.hostname === "youtu.be") {
          return u.pathname.slice(1);
        }
        if (u.searchParams.get("v")) {
          return u.searchParams.get("v");
        }
        let parts = u.pathname.split("/");
        let maybeID = parts[parts.length - 1];
        if (maybeID.length === 11) return maybeID;
      } catch (e) {
        if (url.length === 11) return url;
      }
      return null;
    }

    function playVideo(videoID) {
      document.getElementById('videoContainer').innerHTML =
        `<iframe src="https://www.youtube.com/embed/${videoID}" allowfullscreen></iframe>`;
    }

    function wordCount(str) {
      return str.trim().split(/\s+/).filter(Boolean).length;
    }

    function saveVideo() {
      const input = document.getElementById('youtubeLink').value.trim();
      const note = document.getElementById('accountabilityNote').value.trim();
      const videoID = extractVideoID(input);
      const error = document.getElementById('error');

      if (!videoID) {
        error.textContent = '⚠️ Invalid YouTube URL';
        return;
      }
      if (wordCount(note) < 50) {
        error.textContent = '⚠️ Please write at least 50 words before saving.';
        return;
      }
      error.textContent = '';

      let saved = JSON.parse(localStorage.getItem('gaganVideos') || '[]');

      if (saved.length >= 100) {
        alert('You can only save up to 100 videos.');
        return;
      }

      if (!saved.some(v => v.id === videoID)) {
        saved.push({ id: videoID, note: note });
        localStorage.setItem('gaganVideos', JSON.stringify(saved));
        renderSaved();
      } else {
        alert('This video is already saved.');
      }

      document.getElementById('youtubeLink').value = "";
      document.getElementById('accountabilityNote').value = "";
      document.getElementById('wordCount').textContent = "0 / 50 words";
    }

    function removeVideo(id) {
      let saved = JSON.parse(localStorage.getItem('gaganVideos') || '[]');
      saved = saved.filter(v => v.id !== id);
      localStorage.setItem('gaganVideos', JSON.stringify(saved));
      renderSaved();
    }

    function clearAllVideos() {
      if (confirm("Are you sure you want to delete ALL saved videos?")) {
        localStorage.removeItem('gaganVideos');
        renderSaved();
      }
    }

    function renderSaved() {
      const saved = JSON.parse(localStorage.getItem('gaganVideos') || '[]');
      const container = document.getElementById('savedVideos');
      container.innerHTML = '';
      saved.forEach(v => {
        const card = document.createElement('div');
        card.className = 'videoCard';
        card.innerHTML = `
          <button class="removeBtn">X</button>
          <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="Thumbnail">
          <p><b>Link:</b> https://youtu.be/${v.id}</p>
          <p><b>Note:</b> ${v.note}</p>
        `;
        card.onclick = () => playVideo(v.id);

        // Attach remove button properly
        const removeBtn = card.querySelector('.removeBtn');
        removeBtn.onclick = (e) => {
          e.stopPropagation();
          removeVideo(v.id);
        };

        container.appendChild(card);
      });
    }

    // Live word counter
    document.getElementById('accountabilityNote').addEventListener('input', function() {
      const count = wordCount(this.value);
      document.getElementById('wordCount').textContent = count + " / 50 words";
      if (count < 50) {
        document.getElementById('wordCount').style.color = "#ff4d4d";
      } else {
        document.getElementById('wordCount').style.color = "#4dff88";
      }
    });

    renderSaved();
  </script>

</body>
</html>
